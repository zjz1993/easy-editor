<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textory Standalone — 基础用法</title>
  <link rel="stylesheet" href="../../packages/standalone/dist/textory.min.css">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 960px; margin: 20px auto; padding: 0 20px; color: #1f2328; }
    #editor { border: 1px solid #d0d7de; border-radius: 6px; min-height: 400px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
    button { padding: 6px 12px; cursor: pointer; }
    a { color: #0969da; }
  </style>
</head>
<body>
  <h1>基础用法 — <code>textory.standalone.min.js</code></h1>
  <p>引一个 CSS + 一个 JS，开箱即用。无 React 项目也能跑。</p>
  <p>
    <button id="get-html">getHTML()</button>
    <button id="set-html">setHTML('&lt;p&gt;setHTML 注入&lt;/p&gt;')</button>
    <button id="destroy">destroy()</button>
    <a href="index.html">← 返回</a>
  </p>
  <div id="editor"></div>
  <h3>当前 HTML：</h3>
  <pre id="output">（点击 getHTML）</pre>

  <script src="../../packages/standalone/dist/textory.standalone.min.js"></script>
  <script>
    const instance = Textory.create(document.getElementById('editor'), {
      content: '<p>编辑器已就绪。<strong>试试输入</strong>。</p>',
      placeholder: '请输入...',
      onChange(html) {
        document.getElementById('output').textContent = html;
      },
      onCreate() {
        console.log('[demo] editor ready');
      },
    });

    document.getElementById('get-html').addEventListener('click', () => {
      document.getElementById('output').textContent = instance.getHTML();
    });
    document.getElementById('set-html').addEventListener('click', () => {
      instance.setHTML('<p>setHTML 注入的内容 <em>斜体</em></p>');
    });
    document.getElementById('destroy').addEventListener('click', () => {
      instance.destroy();
      console.log('[demo] destroyed,后续 getHTML 应该 console.warn');
      // 测试失效保护
      setTimeout(() => instance.getHTML(), 100);
    });
  </script>
</body>
</html>
