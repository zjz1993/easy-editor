<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textory Standalone — External React</title>
  <link rel="stylesheet" href="../../packages/standalone/dist/textory.min.css">
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 960px; margin: 20px auto; padding: 0 20px; color: #1f2328; }
    #editor { border: 1px solid #d0d7de; border-radius: 6px; min-height: 400px; }
    a { color: #0969da; }
    .note { background: #fff8c5; padding: 8px 12px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>External React — <code>textory.externals.min.js</code></h1>
  <p class="note">先引 React/ReactDOM UMD CDN,再引 textory externals。bundle 体积小约 100KB（省 React）。</p>
  <p><a href="index.html">← 返回</a></p>
  <div id="editor"></div>

  <!-- 必须按顺序：React → ReactDOM → Textory -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="../../packages/standalone/dist/textory.externals.min.js"></script>
  <script>
    Textory.create(document.getElementById('editor'), {
      content: '<p>Externals 模式已就绪。</p>',
      onChange(html) {
        console.log('[demo] change', html.slice(0, 50));
      },
    });
  </script>
</body>
</html>
